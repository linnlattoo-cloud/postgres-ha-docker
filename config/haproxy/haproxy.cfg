# HAProxy Load Balancer Configuration for PostgreSQL HA
# Routing Strategy:
#   Port 5000 -> Read/Write Traffic (Forwarded exclusively to the Patroni Leader)
#   Port 5001 -> Read-Only Traffic  (Round-robin load-balanced across standby replicas)
#   Port 7000 -> Web Dashboard UI   (Health metrics & failover visualization)

global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    retries 3
    timeout connect 5s
    timeout client 30m
    timeout server 30m

# Frontend & Backend: Read-Write (Primary Leader Only)
frontend postgres_write
    bind *:5000
    mode tcp
    default_backend postgres_write_backend

backend postgres_write_backend
    mode tcp
    option tcp-check
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 maxconn 200 check port 8008
    server pg2 pg2:5432 maxconn 200 check port 8008
    server pg3 pg3:5432 maxconn 200 check port 8008

# Frontend & Backend: Read-Only (Standby Replicas Pool)
frontend postgres_read
    bind *:5001
    mode tcp
    default_backend postgres_read_backend

backend postgres_read_backend
    mode tcp
    balance roundrobin
    option tcp-check
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server pg1 pg1:5432 maxconn 200 check port 8008
    server pg2 pg2:5432 maxconn 200 check port 8008
    server pg3 pg3:5432 maxconn 200 check port 8008

# HAProxy Statistics Dashboard
listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 3s
    stats show-node
    stats show-legends
    stats auth admin:admin_stats_pass_2026
